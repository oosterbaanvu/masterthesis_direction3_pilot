[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dqstress"
version = "0.1.0"
description = "Stress-testing data-quality controls and evaluating AI-proposed validation rules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.5",
    "pyarrow==22.0.0",
    "openpyxl==3.1.5",
    "scikit-learn==1.7.2",
    "lxml==6.0.2",
    "requests==2.32.5",
]

[project.optional-dependencies]
xbrl = ["arelle-release==2.47.3", "aniso8601==10.0.1", "pyparsing==3.2.5"]
llm = ["llama-cpp-python==0.3.16", "huggingface_hub==0.35.3"]
dev = ["pytest==8.3.5"]

[project.scripts]
dqstress = "dqstress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
